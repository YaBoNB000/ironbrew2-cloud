# 云端混淆
# 触发方式:
#   ① push 到 src/ 目录 → 自动混淆 src/ 下所有已跟踪的 .lua
#   ② 手动 Run workflow → 可指定单个文件
# 产物会提交到 out/，并同时上传为 Artifact。
name: 云端混淆

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      source_file:
        description: '源码路径（如 src/Main.lua；留空=混淆 src/ 全部）'
        required: false
        default: ''

# 允许 github-actions[bot] 把 out/ 产物提交回仓库。
permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建混淆器并检查工具
        shell: pwsh
        run: |
          dotnet --version
          if (!(Test-Path "Lua\luac.exe") -or !(Test-Path "Lua\lua.exe")) {
            throw "缺少 Lua\luac.exe 或 Lua\lua.exe"
          }
          dotnet build "IronBrew2 CLI\IronBrew2 CLI.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw "IronBrew2 CLI 构建失败" }
          if (!(Test-Path "IronBrew2 CLI\bin\Release\net8.0\IronBrew2 CLI.dll")) {
            throw "构建后未找到 IronBrew2 CLI.dll"
          }

      - name: 配置 Lua 工具环境
        shell: pwsh
        run: |
          "${{ github.workspace }}\Lua" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LUA_PATH=${{ github.workspace }}\Lua\Minifier\?.lua;;" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 确定要混淆的文件
        shell: pwsh
        env:
          SOURCE_FILE: ${{ inputs.source_file }}
        run: |
          $manual = "$env:SOURCE_FILE".Trim()
          if ($manual -ne "") {
            if (!(Test-Path -LiteralPath $manual -PathType Leaf)) {
              throw "找不到源码文件: $manual"
            }
            $files = @($manual)
          } else {
            $files = @(git ls-files -- "src/*.lua" | Where-Object { $_.Trim() -ne "" })
          }
          if ($files.Count -eq 0) { throw "没有找到要混淆的 .lua 文件" }
          Write-Output "目标文件: $($files -join ', ')"
          $files | Set-Content -LiteralPath ".ib2-targets.txt" -Encoding utf8

      - name: 逐个混淆
        shell: pwsh
        run: |
          $files = @(Get-Content -LiteralPath ".ib2-targets.txt" | Where-Object { $_.Trim() -ne "" })
          if ($files.Count -eq 0) { throw "目标文件列表为空" }
          New-Item -ItemType Directory -Force "out" | Out-Null
          foreach ($f in $files) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($f)
            Write-Output "=== 混淆: $f ==="
            Remove-Item -LiteralPath "out.lua" -Force -ErrorAction SilentlyContinue
            dotnet "IronBrew2 CLI\bin\Release\net8.0\IronBrew2 CLI.dll" "$f"
            if ($LASTEXITCODE -ne 0) { throw "混淆器执行失败: $f" }
            if (!(Test-Path -LiteralPath "out.lua" -PathType Leaf)) {
              throw "混淆失败: $f 未生成 out.lua"
            }
            $target = Join-Path "out" ($base + "_obf.lua")
            Move-Item -LiteralPath "out.lua" -Destination $target -Force
            Write-Output "产物: $target ($((Get-Item -LiteralPath $target).Length) 字节)"
          }

      - name: 产物提交回仓库
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/
          if (git diff --cached --quiet) {
            Write-Output "无新增产物，跳过提交"
          } else {
            git commit -m "云端混淆产物: ${{ github.run_number }}"
            if ($LASTEXITCODE -ne 0) { throw "创建产物提交失败" }
            git push
            if ($LASTEXITCODE -ne 0) { throw "推送产物提交失败" }
            Write-Output "已提交产物到 out/"
          }

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obfuscated-${{ github.run_number }}
          path: out/
          if-no-files-found: error
